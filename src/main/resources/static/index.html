<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Demo page for POUG Meetup 5 September 2026" />
        <meta name="author" content="Göran Paues" />

        <title>Demo page for POUG Meetup 5 September 2026</title>

        <link href="/css/bootstrap.min.css" rel="stylesheet" />
        <link href="/css/demo.css" rel="stylesheet" />

        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
        <script type="text/javascript" src="/js/jquery-2.2.2.min.js"></script>
        <script type="text/javascript">
            $(function(){
                var sharedPalette = ['#0075c2', '#1aaf5d', '#f2c500', '#f45b00', '#8e0000', '#845EC2', '#2C73D2', '#008E9B'];

                var toLabels = function(chartData) {
                    return chartData.map(function(point) {
                        return point.category;
                    });
                };

                var toValues = function(chartData) {
                    return chartData.map(function(point) {
                        return Number(point.amount);
                    });
                };

                var buildDatasetColors = function(size) {
                    var colors = [];
                    for (var i = 0; i < size; i++) {
                        colors.push(sharedPalette[i % sharedPalette.length]);
                    }
                    return colors;
                };

                var renderPlatformChart = function(data) {
                    new Chart($('#platformChartCanvas')[0], {
                        type: 'bar',
                        data: {
                            labels: toLabels(data),
                            datasets: [{
                                label: 'Games',
                                data: toValues(data),
                                backgroundColor: buildDatasetColors(data.length)
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                title: {
                                    display: true,
                                    text: 'Games played per platform'
                                },
                                legend: {
                                    display: false
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                };

                var renderRatingChart = function(data) {
                    new Chart($('#ratingChartCanvas')[0], {
                        type: 'doughnut',
                        data: {
                            labels: toLabels(data).map(function(label) { return 'Rating ' + label; }),
                            datasets: [{
                                label: 'Games',
                                data: toValues(data),
                                backgroundColor: buildDatasetColors(data.length)
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                title: {
                                    display: true,
                                    text: 'Games by rating'
                                }
                            }
                        }
                    });
                };

                var renderShelfChart = function(data) {
                    new Chart($('#shelfChartCanvas')[0], {
                        type: 'polarArea',
                        data: {
                            labels: toLabels(data),
                            datasets: [{
                                label: 'Games',
                                data: toValues(data),
                                backgroundColor: buildDatasetColors(data.length)
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                title: {
                                    display: true,
                                    text: 'Games by shelf'
                                }
                            }
                        }
                    });
                };

                $.getJSON('/platform', renderPlatformChart);
                $.getJSON('/ratings', renderRatingChart);
                $.getJSON('/shelves', renderShelfChart);
                });
        </script>
        </head>
    <body>
        <div class="container">
            <div class="header clearfix">
                <h3 class="text-muted">POUG Demo 5 September 2026<br />
                    Showing how improved context can let AI create better code.</h3>
            </div>
            <div class="row">
                <div class="col-lg-6">
                    <div class="col-lg-12">
                        <canvas id="platformChartCanvas" width="400" height="300">The platform chart will load here!</canvas>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6">
                        <div class="col-lg-12">
                            <canvas id="ratingChartCanvas" width="400" height="300">The rating chart will load here!</canvas>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="col-lg-12">
                            <canvas id="shelfChartCanvas" width="400" height="300">The shelf chart will load here!</canvas>
                        </div>
                    </div>
                </div>

            </div>
            <footer class="footer">
                <p>Made with ❤️ by <a href="http://guran.com">Göran Paues</a> and his trusty AI agents.</p>
            </footer>
        </div>
    </body>
</html>
